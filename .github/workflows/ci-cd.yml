name: CI-CD AchoFlores

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # 1) BUILD: dependencias con lockfile, lint con reglas de seguridad y compilación.
  build:
    name: Build y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: api
      - name: Lint (ESLint + eslint-plugin-security + TypeScript)
        run: npm run lint
      - name: Build (web + api)
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # 2) TEST: unitarias e integración contra PostgreSQL real en un contenedor de servicio.
  test:
    name: Tests y cobertura
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: achoflores_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/achoflores_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: api
      - name: Tests API (Vitest + Supertest) — umbral de cobertura 70 %
        run: npm test -w api -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Tests Web (Vitest + Testing Library)
        run: npm test -w web -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Resumen de cobertura
        if: always()
        run: |
          node -e '
          const fs=require("fs");
          let out="## Resultados de pruebas\n\n| Paquete | Líneas | Sentencias | Funciones | Ramas |\n|---|---|---|---|---|\n";
          for (const p of ["api","web"]) {
            const f=`${p}/coverage/coverage-summary.json`;
            if (!fs.existsSync(f)) continue;
            const t=JSON.parse(fs.readFileSync(f)).total;
            out+=`| ${p} | ${t.lines.pct}% | ${t.statements.pct}% | ${t.functions.pct}% | ${t.branches.pct}% |\n`;
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out);'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-y-resultados
          path: |
            api/coverage
            web/coverage
            api/test-results.xml
            web/test-results.xml
          retention-days: 14

  # 3) SEGURIDAD: SAST, dependencias, secretos e imagen de contenedor.
  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-js

  dependencias:
    name: Dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (falla con vulnerabilidades altas o críticas)
        run: npm audit --audit-level=high

  secretos:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  imagen:
    name: Imagen Docker (Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t achoflores:${{ github.sha }} .
      - name: Escanear imagen (HIGH/CRITICAL con parche disponible detienen el pipeline)
        uses: aquasecurity/trivy-action@v0.35.0 # release inmutable; ver CVE-2026-33634
        with:
          image-ref: achoflores:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Reporte SARIF para la pestaña Security
        if: always()
        uses: aquasecurity/trivy-action@v0.35.0 # release inmutable; ver CVE-2026-33634
        with:
          image-ref: achoflores:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy

  # 4) DEPLOY: solo en push a develop (staging) o main (producción) y con todo en verde.
  deploy:
    name: Deploy a ${{ github.ref_name == 'main' && 'producción' || 'staging' }}
    runs-on: ubuntu-latest
    needs: [test, sast-codeql, dependencias, secretos, imagen]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && vars.PROD_URL || vars.STAGING_URL }}
    steps:
      - name: Disparar deploy en Render
        env:
          HOOK: ${{ github.ref_name == 'main' && secrets.RENDER_DEPLOY_HOOK_PROD || secrets.RENDER_DEPLOY_HOOK_STAGING }}
          TARGET_URL: ${{ github.ref_name == 'main' && vars.PROD_URL || vars.STAGING_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Deploy hook de Render no configurado; se omite el despliegue."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy solicitado a Render (commit ${GITHUB_SHA::7})."
      - name: Esperar a que el servicio responda /health
        env:
          TARGET_URL: ${{ github.ref_name == 'main' && vars.PROD_URL || vars.STAGING_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then echo "URL no configurada"; exit 0; fi
          for i in $(seq 1 40); do
            if curl -fsS "$TARGET_URL/health" | grep -q '"status":"ok"'; then echo "Servicio en línea"; exit 0; fi
            sleep 15
          done
          echo "::error::El servicio no respondió a tiempo"; exit 1

  # DAST: escaneo OWASP ZAP baseline contra staging después de desplegar develop.
  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref_name == 'develop' && vars.STAGING_URL != ''
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.STAGING_URL }}
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: false
